<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal | RoadSafetyInsights</title>
    
    <!-- Icons & Theme -->
    <link rel="icon" type="image/png" href="assets/rsi_logo.png" />
    <link rel="apple-touch-icon" href="assets/rsi_logo.png" />
    <meta name="theme-color" content="#0a2540" />
    
    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    
    <style>
      .easter-egg-page {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 100vh; text-align: center;
        background: var(--navy); color: #eaf4ff;
        padding: 20px; overflow: hidden; position: relative;
      }
      
      .terminal-box {
        width: 100%;
        max-width: 650px;
        background: rgba(1, 26, 24, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        text-align: left;
      }

      .terminal-header {
        background: #011d1c;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .terminal-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .dot-red { background: #ff5f56; }
      .dot-yellow { background: #ffbd2e; }
      .dot-green { background: #27c93f; }

      .terminal-title {
        margin-left: 8px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        color: #8fa3af;
        letter-spacing: 0.05em;
      }

      .terminal-body {
        font-family: 'Courier New', Courier, monospace;
        color: #0f0;
        padding: 24px;
        line-height: 1.6;
        font-size: 14px;
        min-height: 180px;
      }
      
      .cursor {
        display: inline-block;
        width: 8px;
        height: 1.1em;
        background: #0f0;
        vertical-align: text-bottom;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <main class="easter-egg-page">
      <div class="terminal-box">
        <div class="terminal-header">
          <span class="terminal-dot dot-red"></span>
          <span class="terminal-dot dot-yellow"></span>
          <span class="terminal-dot dot-green"></span>
          <span class="terminal-title">cio@rsi-server:~ (secret)</span>
        </div>
        <div class="terminal-body" id="terminal">
          <span id="typewriter"></span><span class="cursor" id="cursor"></span>
        </div>
      </div>

      <div style="margin-top: 30px; z-index: 10;">
        <a class="btn btn--line" href="index.html">
          [ Επιστροφή στην Αρχική ] <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </main>

    <script>
      const text = "> Initializing secure connection...\n> Target endpoint reached.\n> Hidden route detected.\n\nIf u found this, get in touch with the dev team :D\n\n> Connection terminated.";
      const typeElement = document.getElementById('typewriter');
      const cursorElement = document.getElementById('cursor');
      let i = 0;

      function typeWriter() {
        if (i < text.length) {
          if (text.charAt(i) === '\n') {
            typeElement.innerHTML += '<br>';
          } else {
            typeElement.innerHTML += text.charAt(i);
          }
          i++;
          setTimeout(typeWriter, 45);
        } else {
        }
      }

      setTimeout(typeWriter, 800);
    </script>
  </body>
</html>
